name: Feature request
description: Suggest a new skill, command, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement. Please describe what you want and why.

  - type: dropdown
    id: kind
    attributes:
      label: What are you proposing?
      options:
        - New skill
        - New slash command
        - Improvement to existing skill
        - Improvement to existing command
        - New Torque API endpoint wrapper (under skills/zero-touch-api/scripts/examples/)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user pain or missing capability.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the skill / command / behavior look like? Include example invocations if possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why this one is better.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Customer story, links to Torque docs, screenshots, related issues.
