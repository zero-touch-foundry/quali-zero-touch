name: Bug report
description: Report a bug in the quali-zero-touch
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the details below.

  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: Run `claude --version` and paste the output.
      placeholder: "e.g. 1.2.3"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: From `.claude-plugin/plugin.json` (`version` field).
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of the plugin is misbehaving?
      options:
        - Skill (specify which one in the description)
        - Slash command (specify which one in the description)
        - zero-touch-api helper / example script
        - Plugin install / load
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior. Paste error messages verbatim if applicable.
      placeholder: e.g. "Ran /launch-env, got: ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that consistently reproduce the issue.
      placeholder: |
        1. Set TORQUE_API_TOKEN to ...
        2. Run /env-status my-env
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, shell, Python version (`python --version`), Torque account region.
      placeholder: |
        - OS: macOS 14.5
        - Shell: zsh 5.9
        - Python: 3.11.6
        - Torque region: us-east-1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Redacted Claude Code transcript or script error output. **Do NOT include your TORQUE_API_TOKEN.**
      render: shell
